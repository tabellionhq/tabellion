#
# review: how the fact reaches this state (US-09)
#   accept        proposed by the import, accepted as is
#   edit          proposed by the import, edited, then accepted
#   split         one proposed fact replaced by several, same excerpt
#   expand        added by Anne from an excerpt, next to the facts proposed from it
#   resolve       a term the import did not resolve; Anne picks the concept
#   complete      proposed without a start date or level the CV does not give; Anne completes it, then accepts

