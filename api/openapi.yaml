openapi: 3.1.0
info:
  title: Tabellion
  version: 0.1.0-draft
  summary: HTTP API of Tabellion.
  description: |
    Stores occupations held, practices (an ESCO skill on a Wikidata concept, at an occupation,
    over a period, with an optional level from 1 to 5) and views (filters on them).

    Start with `GET /`. Each response lists the possible next requests in `potentialAction`:
    a name, an HTTP method, a URL template. The paths below may change; the actions do not.
    The actions of each schema are listed in its `x-actions`.

    The owner can edit any fact. A wrong fact is corrected by editing it; a change over time, such as a new level,
    is recorded as a new practice.

    Responses are JSON-LD; the context is `/contexts/curriculum.jsonld`. JSON clients can
    ignore fields starting with `@`.

    Errors follow RFC 9457.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
externalDocs:
  description: Specification of the data model and the rules (draft-tabellion-curriculum-00). This contract is its HTTP binding; the specification prevails.
  url: ../docs/RFC.md

servers:
  - url: http://localhost/api
    description: Local server; the web UI is served under /ui

x-actions-format: |
  Each `x-actions` entry is rendered in responses as a schema.org Action in `potentialAction`:
  `type` → `@type`, `name` → `name`, `method` → `target.httpMethod`, `target` → `target.urlTemplate`
  (`@id` means the resource itself), `body` → `object`.
  `when` is the condition for the action to appear; without it, the action always appears.

tags:
  - name: entry
  - name: import
  - name: facts
  - name: views
  - name: identities
  - name: reference

paths:
  /:
    get:
      tags: [entry]
      summary: Entry point
      operationId: getEntry
      responses:
        "200":
          description: Links to what the caller may reach
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Entry"}

  /persons/{personId}:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [entry]
      summary: A person's record, as links to its parts
      operationId: getPerson
      responses:
        "200":
          description: The person
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Person"}
        "404": {$ref: "#/components/responses/Problem"}

  /imports:
    post:
      tags: [import]
      summary: Import a CV as plain text. Extracted occupations and practices are created with status proposed
      operationId: createImport
      requestBody:
        required: true
        content:
          text/plain:
            schema: {type: string}
      responses:
        "202":
          description: Import accepted; a task runs the extraction. `Location` is the task
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}

  /tasks/{taskId}:
    parameters:
      - {$ref: "#/components/parameters/taskId"}
    get:
      tags: [import]
      summary: Task state and result
      operationId: getTask
      responses:
        "200":
          description: The task
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Task"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [import]
      summary: Move a task to another stage, stop it, or resume it
      description: Only the changes offered by the task's actions are accepted; the kind of task defines its stages.
      operationId: changeTask
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: "#/components/schemas/TaskChange"}
      responses:
        "200":
          description: The task, as changed
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Task"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
    delete:
      tags: [import]
      summary: Delete a task and its result; the facts it proposed stay
      operationId: deleteTask
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/Problem"}

  /tasks/{taskId}/rejections:
    parameters:
      - {$ref: "#/components/parameters/taskId"}
    post:
      tags: [import]
      summary: Reject every fact still proposed by this task
      operationId: rejectTaskFacts
      responses:
        "200":
          description: The task, its proposed facts now rejected
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Task"}
        "404": {$ref: "#/components/responses/Problem"}

  /persons/{personId}/occupations:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [facts]
      summary: List occupations held, optionally by status
      operationId: listOccupations
      parameters:
        - {$ref: "#/components/parameters/status"}
      responses:
        "200":
          description: Occupations held
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/OccupationList"}
    post:
      tags: [facts]
      summary: Create an occupation held, status proposed
      operationId: createOccupation
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/OccupationHeldInput"}
      responses:
        "201":
          description: Created, status proposed
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/OccupationHeld"}
        "400": {$ref: "#/components/responses/Problem"}

  /occupations/{factId}:
    parameters:
      - {$ref: "#/components/parameters/factId"}
    get:
      tags: [facts]
      summary: One occupation held
      operationId: getOccupation
      responses:
        "200":
          description: The occupation held
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/OccupationHeld"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [facts]
      summary: Edit an occupation, accept or reject it
      operationId: reviewOccupation
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: "#/components/schemas/OccupationReview"}
      responses:
        "200":
          description: The occupation, as changed
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/OccupationHeld"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /persons/{personId}/practices:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [facts]
      summary: List practices, optionally by status
      operationId: listPractices
      parameters:
        - {$ref: "#/components/parameters/status"}
      responses:
        "200":
          description: Practices
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/PracticeList"}
    post:
      tags: [facts]
      summary: Create a practice, status proposed
      operationId: createPractice
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/PracticeInput"}
      responses:
        "201":
          description: Created, status proposed
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Practice"}
        "400": {$ref: "#/components/responses/Problem"}

  /practices/{factId}:
    parameters:
      - {$ref: "#/components/parameters/factId"}
    get:
      tags: [facts]
      summary: One practice
      operationId: getPractice
      responses:
        "200":
          description: The practice
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Practice"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [facts]
      summary: Edit a practice, accept or reject it
      operationId: reviewPractice
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: "#/components/schemas/PracticeReview"}
      responses:
        "200":
          description: The practice, as changed
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Practice"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /persons/{personId}/identities:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [identities]
      summary: Identities the person presents
      operationId: listIdentities
      responses:
        "200":
          description: Identities
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/IdentityList"}
    post:
      tags: [identities]
      summary: Add an identity, e.g. the name and contact on a CV
      operationId: createIdentity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/IdentityInput"}
      responses:
        "201":
          description: Created
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Identity"}
        "400": {$ref: "#/components/responses/Problem"}

  /persons/{personId}/views:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [views]
      summary: Views of the record
      operationId: listViews
      responses:
        "200":
          description: Views
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/ViewList"}
    post:
      tags: [views]
      summary: Create a view
      operationId: createView
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/ViewInput"}
      responses:
        "201":
          description: Created
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/View"}
        "400": {$ref: "#/components/responses/Problem"}

  /views/{viewId}:
    parameters:
      - {$ref: "#/components/parameters/viewId"}
    get:
      tags: [views]
      summary: One view
      operationId: getView
      responses:
        "200":
          description: The view
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/View"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      tags: [views]
      summary: Edit a view; views are not facts
      operationId: replaceView
      parameters:
        - {$ref: "#/components/parameters/ifMatch"}
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/ViewInput"}
      responses:
        "200":
          description: Replaced
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/View"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}

  /views/{viewId}/facts:
    parameters:
      - {$ref: "#/components/parameters/viewId"}
    get:
      tags: [views]
      summary: Facts selected by the view, with its fields only
      operationId: getViewFacts
      parameters:
        - {$ref: "#/components/parameters/ifNoneMatch"}
      responses:
        "200":
          description: Visible facts
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Last-Modified: {$ref: "#/components/headers/LastModified"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/ViewFacts"}
        "304":
          description: Not modified
        "404": {$ref: "#/components/responses/Problem"}

  /views/{viewId}/resume:
    parameters:
      - {$ref: "#/components/parameters/viewId"}
    get:
      tags: [views]
      summary: Facts selected by the view, as a JSON Resume document
      operationId: getViewResume
      parameters:
        - name: identity
          in: query
          required: true
          description: The identity whose name and contact go on the CV
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: A JSON Resume document; render it with any JSON Resume theme
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema:
                description: JSON Resume schema, https://jsonresume.org/schema
                type: object
        "404": {$ref: "#/components/responses/Problem"}

  /reference/skills:
    get:
      tags: [reference]
      summary: Search ESCO skills and skill groups
      operationId: searchSkills
      parameters:
        - {$ref: "#/components/parameters/q"}
        - {$ref: "#/components/parameters/language"}
      responses:
        "200":
          description: Ranked candidates
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/SkillCandidateList"}

  /reference/concepts:
    get:
      tags: [reference]
      summary: Search Wikidata concepts
      operationId: searchConcepts
      parameters:
        - {$ref: "#/components/parameters/q"}
        - {$ref: "#/components/parameters/language"}
      responses:
        "200":
          description: Ranked candidates
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/ConceptCandidateList"}

components:
  parameters:
    personId: {name: personId, in: path, required: true, schema: {type: string, format: uuid}}
    factId: {name: factId, in: path, required: true, schema: {type: string, format: uuid}}
    viewId: {name: viewId, in: path, required: true, schema: {type: string, format: uuid}}
    taskId: {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
    status:
      name: status
      in: query
      schema: {$ref: "#/components/schemas/Status"}
    q:
      name: q
      in: query
      required: true
      schema: {type: string, minLength: 1}
    language:
      name: language
      in: query
      description: BCP 47 language tag of the words
      schema: {type: string, default: en}
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    ifNoneMatch:
      name: If-None-Match
      in: header
      schema: {type: string}

  headers:
    Location:
      schema: {type: string, format: uri-reference}
    ETag:
      schema: {type: string}
    LastModified:
      schema: {type: string}
    CacheControl:
      schema: {type: string}

  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}

  schemas:
    Status:
      type: string
      enum: [proposed, accepted, rejected]

    Uri:
      type: string
      format: uri

    PartialDate:
      description: A date at the precision its source gives, year, year and month, or full date (YYYY, YYYY-MM, YYYY-MM-DD). It stands for the whole year or month it names.
      type: string
      pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12][0-9]|3[01]))?)?$"

    Level:
      description: 1 basic, 2 intermediate, 3 experienced, 4 advanced, 5 expert; null when unknown
      oneOf:
        - {type: integer, minimum: 1, maximum: 5}
        - {type: "null"}

    Resource:
      description: Every resource has an identifier, a type and the actions available next
      type: object
      required: ["@id", "@type", potentialAction]
      properties:
        "@context": {type: string, format: uri-reference, x-go-name: JSONLDContext}
        "@id": {type: string, format: uri-reference}
        "@type": {type: string}
        potentialAction:
          type: array
          items: {$ref: "#/components/schemas/Action"}

    Action:
      description: A possible next request, as a schema.org Action
      type: object
      required: ["@type", name, target]
      properties:
        "@type":
          type: string
          examples: [AcceptAction, RejectAction, CancelAction, CreateAction, UpdateAction, ViewAction, SearchAction]
        name:
          type: string
          description: What the action does, in plain words
        target: {$ref: "#/components/schemas/EntryPoint"}
        object:
          description: Body to send, when fixed
          type: object

    EntryPoint:
      type: object
      required: [httpMethod, urlTemplate]
      properties:
        "@type": {const: EntryPoint}
        httpMethod: {type: string, enum: [GET, POST, PUT, PATCH]}
        urlTemplate: {type: string, description: RFC 6570 URL template}
        contentType: {type: string}

    Entry:
      x-actions:
        - {type: ViewAction, name: My record, method: GET, target: "/persons/{personId}"}
        - {type: CreateAction, name: Import a CV, method: POST, target: /imports, contentType: text/plain}
        - {type: SearchAction, name: Review proposed practices, method: GET, target: "/persons/{personId}/practices?status=proposed"}
        - {type: SearchAction, name: Review proposed occupations, method: GET, target: "/persons/{personId}/occupations?status=proposed"}
        - {type: ViewAction, name: My views, method: GET, target: "/persons/{personId}/views"}
        - {type: ViewAction, name: My identities, method: GET, target: "/persons/{personId}/identities"}
        - {type: SearchAction, name: Find an ESCO skill, method: GET, target: "/reference/skills{?q,language}"}
        - {type: SearchAction, name: Find a Wikidata concept, method: GET, target: "/reference/concepts{?q,language}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            person: {type: string, format: uri-reference}

    Person:
      x-actions:
        - {type: ViewAction, name: Occupations held, method: GET, target: "/persons/{personId}/occupations"}
        - {type: ViewAction, name: Practices, method: GET, target: "/persons/{personId}/practices"}
        - {type: ViewAction, name: Identities, method: GET, target: "/persons/{personId}/identities"}
        - {type: ViewAction, name: Views, method: GET, target: "/persons/{personId}/views"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            completion:
              description: Average completion of the record's facts that are not rejected, from 0 to 1
              type: number
              minimum: 0
              maximum: 1
              readOnly: true

    Concept:
      description: Wikidata concept (`is`), refined by other Wikidata concepts (`with`), with an optional label
      type: object
      required: [is]
      properties:
        is: {$ref: "#/components/schemas/Uri"}
        with:
          type: array
          items: {$ref: "#/components/schemas/Uri"}
          default: []
        label: {type: [string, "null"]}

    FactFields:
      type: object
      required: [author, recorded, status, completion]
      properties:
        author: {type: string}
        recorded: {type: string, format: date-time}
        status: {$ref: "#/components/schemas/Status"}
        completion:
          description: Share of the fact's fields that are set, from 0 to 1; computed by the server
          type: number
          minimum: 0
          maximum: 1
          readOnly: true
        evidence:
          description: Any JSON, e.g. a CV excerpt or a certificate link; stored and returned unchanged

    OccupationHeldInput:
      type: object
      required: [label, kind, from]
      properties:
        occupation:
          description: ESCO occupation
          oneOf: [{$ref: "#/components/schemas/Uri"}, {type: "null"}]
        label: {type: string}
        kind: {type: string, enum: [work, pleasure, study]}
        from: {$ref: "#/components/schemas/PartialDate"}
        to: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}
        evidence: {}

    OccupationHeld:
      x-actions:
        - {type: UpdateAction, name: Edit this occupation, method: PATCH, target: "@id"}
        - {type: AcceptAction, name: Accept this occupation, method: PATCH, target: "@id", body: {status: accepted}, when: status is not accepted}
        - {type: RejectAction, name: Reject this occupation, method: PATCH, target: "@id", body: {status: rejected}, when: status is not rejected}
        - {type: CreateAction, name: Add a practice at this occupation, method: POST, target: "/persons/{personId}/practices", when: status is accepted}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - $ref: "#/components/schemas/OccupationHeldInput"
        - $ref: "#/components/schemas/FactFields"

    PracticeInput:
      type: object
      required: [skill, concept, from]
      properties:
        skill:
          description: ESCO skill
          allOf: [{$ref: "#/components/schemas/Uri"}]
        concept: {$ref: "#/components/schemas/Concept"}
        context:
          description: Wikidata item, e.g. a language
          oneOf: [{$ref: "#/components/schemas/Uri"}, {type: "null"}]
        occupation:
          description: The occupation held, by its @id
          type: [string, "null"]
          format: uri-reference
        from:
          description: Start of the period. Null only on a proposed practice whose source gives no period; required to accept.
          oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]
        to: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}
        level: {$ref: "#/components/schemas/Level"}
        evidence:
          description: Any JSON. From a CV import, `{excerpt, file, line}`.

    Practice:
      x-actions:
        - {type: UpdateAction, name: Correct this practice, method: PATCH, target: "@id"}
        - {type: AcceptAction, name: Accept this practice, method: PATCH, target: "@id", body: {status: accepted}, when: status is not accepted and from is set}
        - {type: RejectAction, name: Reject this practice, method: PATCH, target: "@id", body: {status: rejected}, when: status is not rejected}
        - {type: CreateAction, name: Record progress as a new practice, method: POST, target: "/persons/{personId}/practices", when: status is accepted}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - $ref: "#/components/schemas/PracticeInput"
        - $ref: "#/components/schemas/FactFields"

    Review:
      description: Sets the status of a fact; without it, the status is unchanged
      type: object
      properties:
        status: {type: string, enum: [accepted, rejected]}

    OccupationReview:
      description: Merge patch on an occupation; fields edited, status optional
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: object
          properties:
            occupation: {oneOf: [{$ref: "#/components/schemas/Uri"}, {type: "null"}]}
            label: {type: string}
            kind: {type: string, enum: [work, pleasure, study]}
            from: {$ref: "#/components/schemas/PartialDate"}
            to: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}

    PracticeReview:
      description: Merge patch on a practice; fields edited, status optional
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: object
          properties:
            skill: {$ref: "#/components/schemas/Uri"}
            concept: {$ref: "#/components/schemas/Concept"}
            context: {oneOf: [{$ref: "#/components/schemas/Uri"}, {type: "null"}]}
            from: {$ref: "#/components/schemas/PartialDate"}
            to: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}
            level: {$ref: "#/components/schemas/Level"}

    IdentityInput:
      type: object
      required: [label]
      properties:
        label: {type: string}
        contact: {type: [string, "null"]}

    Identity:
      x-actions:
        - {type: ViewAction, name: Back to my record, method: GET, target: "/persons/{personId}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - $ref: "#/components/schemas/IdentityInput"

    ViewInput:
      type: object
      properties:
        label: {type: string, description: e.g. the job offer it is for}
        include:
          type: object
          properties:
            occupation_kind:
              type: [array, "null"]
              items: {type: string, enum: [work, pleasure, study]}
            occupation:
              type: [array, "null"]
              items: {type: string, format: uri-reference}
            period:
              description: A fact is included if its period overlaps this one.
              type: [object, "null"]
              properties:
                from: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}
                to: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}
            skill_under:
              description: ESCO skill groups
              type: [array, "null"]
              items: {$ref: "#/components/schemas/Uri"}
            status:
              description: "Default: proposed and accepted; a view with a grant: accepted only"
              type: [array, "null"]
              items: {type: string, enum: [proposed, accepted]}
        include_facts:
          type: array
          items: {type: string, format: uri-reference}
          default: []
        exclude_facts:
          type: array
          items: {type: string, format: uri-reference}
          default: []
        show:
          type: object
          properties:
            level: {type: boolean, default: true}
            evidence: {type: boolean, default: false}

    View:
      x-actions:
        - {type: ViewAction, name: See the facts this view shows, method: GET, target: "/views/{viewId}/facts"}
        - {type: ViewAction, name: Export as a CV (JSON Resume), method: GET, target: "/views/{viewId}/resume{?identity}"}
        - {type: UpdateAction, name: Edit this view, method: PUT, target: "@id", header: If-Match}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - $ref: "#/components/schemas/ViewInput"

    ViewFacts:
      x-actions:
        - {type: ViewAction, name: The view, method: GET, target: "/views/{viewId}"}
        - {type: ViewAction, name: Export as a CV (JSON Resume), method: GET, target: "/views/{viewId}/resume{?identity}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            view: {type: string, format: uri-reference}
            occupations:
              type: array
              items: {$ref: "#/components/schemas/OccupationHeld"}
            practices:
              type: array
              items: {$ref: "#/components/schemas/Practice"}

    Task:
      x-actions:
        - {type: ViewAction, name: Refresh, method: GET, target: "@id", when: state is ongoing}
        - {type: AcceptAction, name: Yes, read it, method: PATCH, target: "@id", body: {stage: find}, when: kind is cv-import and stage is confirm}
        - {type: CancelAction, name: Stop, method: PATCH, target: "@id", body: {state: abandoned}, when: state is ongoing}
        - {type: SearchAction, name: Review the proposed practices, method: GET, target: "/persons/{personId}/practices?status=proposed", when: kind is cv-import and state is finished}
        - {type: SearchAction, name: Review the proposed occupations, method: GET, target: "/persons/{personId}/occupations?status=proposed", when: kind is cv-import and state is finished}
        - {type: UpdateAction, name: Resume, method: PATCH, target: "@id", body: {state: ongoing}, when: state is interrupted and the kind allows it}
        - {type: RejectAction, name: Reject all facts proposed by this task, method: POST, target: "@id/rejections", when: state is interrupted or abandoned}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [kind, state, started]
          properties:
            kind: {type: string, enum: [cv-import]}
            state:
              description: Canonical; ongoing until finished, abandoned or interrupted
              type: string
              enum: [ongoing, finished, abandoned, interrupted]
            stage:
              description: "While ongoing; defined by the kind. cv-import: extract (skipped for text), confirm, find"
              type: [string, "null"]
            stages:
              description: The stages of this task, in order, for a progress bar
              type: array
              items:
                type: object
                required: [name, progress]
                properties:
                  name: {type: string}
                  label: {type: string}
                  progress: {type: string, enum: [done, current, skipped, to-do]}
            text:
              description: "cv-import, at the confirm stage: the extracted text; removed when the task ends"
              type: [string, "null"]
            started: {type: string, format: date-time}
            ended: {type: [string, "null"], format: date-time}
            result:
              description: "Per kind; kept until the task is deleted. cv-import: terms not matched, each removed when resolved into a fact or left out"
              type: [object, "null"]
              properties:
                unresolved:
                  type: array
                  items:
                    type: object
                    properties:
                      term: {type: string}
                      excerpt: {type: string}
            problem:
              oneOf: [{$ref: "#/components/schemas/Problem"}, {type: "null"}]

    TaskChange:
      description: "Merge patch on a task: a stage to move to, or a state: abandoned to stop, ongoing to resume"
      type: object
      properties:
        stage: {type: string}
        state: {type: string, enum: [abandoned, ongoing]}

    Candidate:
      type: object
      required: [id, label, source]
      properties:
        id: {$ref: "#/components/schemas/Uri"}
        label: {type: string}
        description: {type: [string, "null"]}
        source: {type: string, enum: [esco, wikidata]}
        why: {type: string, description: Why it matches}

    OccupationList:
      x-actions:
        - {type: CreateAction, name: Add an occupation, method: POST, target: "/persons/{personId}/occupations"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/OccupationHeld"}}
    PracticeList:
      x-actions:
        - {type: CreateAction, name: Add a practice, method: POST, target: "/persons/{personId}/practices"}
        - {type: SearchAction, name: Filter by status, method: GET, target: "/persons/{personId}/practices{?status}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/Practice"}}
    IdentityList:
      x-actions:
        - {type: CreateAction, name: Add an identity, method: POST, target: "/persons/{personId}/identities"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/Identity"}}
    ViewList:
      x-actions:
        - {type: CreateAction, name: Write a view, method: POST, target: "/persons/{personId}/views"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/View"}}
    SkillCandidateList:
      x-actions:
        - {type: SearchAction, name: Search ESCO skills again, method: GET, target: "/reference/skills{?q,language}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/Candidate"}}
    ConceptCandidateList:
      x-actions:
        - {type: SearchAction, name: Search Wikidata concepts again, method: GET, target: "/reference/concepts{?q,language}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/Candidate"}}

    Problem:
      description: RFC 9457
      type: object
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
