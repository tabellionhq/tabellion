openapi: 3.1.0
info:
  title: Tabellion
  version: 0.1.0-draft
  summary: HTTP API of Tabellion.
  description: |
    Stores occupations held, practices (an ESCO skill on a Wikidata concept, at an occupation,
    over a period, with an optional level from 1 to 5) and views (filters on them).

    Start with `GET /`. Each response lists the possible next requests in `potentialAction`:
    a name, an HTTP method, a URL template. The paths below may change; the actions do not.
    The actions of each schema are listed in its `x-actions`.

    The owner can edit any fact. A wrong fact is corrected by editing it; a change over time, such as a new level,
    is recorded as a new practice.

    Responses are JSON-LD; the context is `/contexts/curriculum.jsonld`. JSON clients can
    ignore fields starting with `@`.

    Errors follow RFC 9457.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
externalDocs:
  description: Specification of the data model and the rules (draft-tabellion-curriculum-00). This contract is its HTTP binding; the specification prevails.
  url: ../docs/RFC.md

servers:
  - url: http://localhost/api
    description: Local server; the web UI is served under /ui

x-actions-format: |
  Each `x-actions` entry is rendered in responses as a schema.org Action in `potentialAction`:
  `type` → `@type`, `name` → `name`, `method` → `target.httpMethod`, `target` → `target.urlTemplate`
  (`@id` means the resource itself), `body` → `object`.
  `when` is the condition for the action to appear; without it, the action always appears.

tags:
  - name: entry
  - name: import
  - name: facts
  - name: views
  - name: grants
  - name: identities
  - name: preferences
  - name: consents
  - name: reference

paths:
  /:
    get:
      tags: [entry]
      summary: Entry point
      operationId: getEntry
      responses:
        "200":
          description: Links to what the caller may reach
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Entry"}

  /server:
    get:
      tags: [entry]
      summary: How this server runs, for the owner
      description: Shown on every screen of the web UI. Never given to a reader.
      operationId: getServer
      responses:
        "200":
          description: The server
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Server"}

  /persons/{personId}:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [entry]
      summary: A person's record, as links to its parts
      operationId: getPerson
      responses:
        "200":
          description: The person
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Person"}
        "404": {$ref: "#/components/responses/Problem"}

  /imports:
    post:
      tags: [import]
      summary: Import a CV as plain text. Extracted occupations and practices are created with status proposed
      operationId: createImport
      requestBody:
        required: true
        content:
          text/plain:
            schema: {type: string}
      responses:
        "202":
          description: Import accepted; a task runs the extraction. `Location` is the task
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}

  /tasks/{taskId}:
    parameters:
      - {$ref: "#/components/parameters/taskId"}
    get:
      tags: [import]
      summary: Task state and result
      operationId: getTask
      responses:
        "200":
          description: The task
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Task"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [import]
      summary: Move a task to another stage, stop it, or resume it
      description: Only the changes offered by the task's actions are accepted; the kind of task defines its stages.
      operationId: changeTask
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: "#/components/schemas/TaskChange"}
      responses:
        "200":
          description: The task, as changed
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Task"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
    delete:
      tags: [import]
      summary: Delete a task and its result; the facts it proposed stay
      operationId: deleteTask
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/Problem"}

  /tasks/{taskId}/rejections:
    parameters:
      - {$ref: "#/components/parameters/taskId"}
    post:
      tags: [import]
      summary: Reject every fact still proposed by this task
      operationId: rejectTaskFacts
      responses:
        "200":
          description: The task, its proposed facts now rejected
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Task"}
        "404": {$ref: "#/components/responses/Problem"}

  /tasks/{taskId}/terms/{termId}:
    parameters:
      - {$ref: "#/components/parameters/taskId"}
      - {$ref: "#/components/parameters/termId"}
    delete:
      tags: [import]
      summary: Leave out a term the import did not match; no fact is recorded
      operationId: leaveOutTerm
      responses:
        "204": {description: Left out}
        "404": {$ref: "#/components/responses/Problem"}

  /persons/{personId}/occupations:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [facts]
      summary: List occupations held, optionally by status
      operationId: listOccupations
      parameters:
        - {$ref: "#/components/parameters/status"}
      responses:
        "200":
          description: Occupations held
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/OccupationList"}
    post:
      tags: [facts]
      summary: Create an occupation held, status proposed
      operationId: createOccupation
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/OccupationHeldInput"}
      responses:
        "201":
          description: Created, status proposed
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/OccupationHeld"}
        "400": {$ref: "#/components/responses/Problem"}

  /occupations/{factId}:
    parameters:
      - {$ref: "#/components/parameters/factId"}
    get:
      tags: [facts]
      summary: One occupation held
      operationId: getOccupation
      responses:
        "200":
          description: The occupation held
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/OccupationHeld"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [facts]
      summary: Edit an occupation, accept or reject it
      operationId: reviewOccupation
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: "#/components/schemas/OccupationReview"}
      responses:
        "200":
          description: The occupation, as changed
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/OccupationHeld"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

    delete:
      tags: [facts]
      summary: Delete an occupation held
      description: If practices refer to it, the owner moves them to another occupation held or deletes them, in the same call; otherwise 409.
      operationId: deleteOccupation
      parameters:
        - name: practices
          in: query
          description: What happens to the practices at this occupation
          schema: {type: string, enum: [move, delete]}
        - name: to
          in: query
          description: With practices=move, the occupation held they move to
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /persons/{personId}/practices:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [facts]
      summary: List practices, optionally by status
      operationId: listPractices
      parameters:
        - {$ref: "#/components/parameters/status"}
      responses:
        "200":
          description: Practices
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/PracticeList"}
    post:
      tags: [facts]
      summary: Create a practice, status proposed
      operationId: createPractice
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/PracticeInput"}
      responses:
        "201":
          description: Created, status proposed
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Practice"}
        "400": {$ref: "#/components/responses/Problem"}

  /practices/{factId}:
    parameters:
      - {$ref: "#/components/parameters/factId"}
    get:
      tags: [facts]
      summary: One practice
      operationId: getPractice
      responses:
        "200":
          description: The practice
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Practice"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [facts]
      summary: Edit a practice, accept or reject it
      operationId: reviewPractice
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: "#/components/schemas/PracticeReview"}
      responses:
        "200":
          description: The practice, as changed
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Practice"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

    delete:
      tags: [facts]
      summary: Delete a practice
      operationId: deletePractice
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/Problem"}

  /persons/{personId}/identities:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [identities]
      summary: Identities the person presents
      operationId: listIdentities
      responses:
        "200":
          description: Identities
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/IdentityList"}
    post:
      tags: [identities]
      summary: Add an identity, e.g. the name and contact on a CV
      operationId: createIdentity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/IdentityInput"}
      responses:
        "201":
          description: Created
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Identity"}
        "400": {$ref: "#/components/responses/Problem"}

  /persons/{personId}/preferences:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [preferences]
      summary: The owner's preferences for this server, with links to those of each kind of plugin
      description: Owner only; a grant gives no access.
      operationId: getPreferences
      responses:
        "200":
          description: Preferences
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Preferences"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [preferences]
      summary: Change preferences; a null value removes one
      operationId: changePreferences
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: "#/components/schemas/PreferencesInput"}
      responses:
        "200":
          description: Preferences, as changed
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Preferences"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}

  /persons/{personId}/preferences/{kind}:
    parameters:
      - {$ref: "#/components/parameters/personId"}
      - {$ref: "#/components/parameters/kind"}
    get:
      tags: [preferences]
      summary: What a kind of plugin keeps for the owner, such as the filters of the last CV
      operationId: getPluginPreferences
      responses:
        "200":
          description: Preferences of the kind
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/PluginPreferences"}
        "404": {$ref: "#/components/responses/Problem"}
    delete:
      tags: [preferences]
      summary: Remove every preference of the kind
      operationId: resetPluginPreferences
      responses:
        "204": {description: Removed}
        "404": {$ref: "#/components/responses/Problem"}

  /persons/{personId}/consents:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [consents]
      summary: Consents given, withdrawn ones included
      operationId: listConsents
      responses:
        "200":
          description: Consents
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/ConsentList"}
    post:
      tags: [consents]
      summary: Give a consent, for one subject or by default for a whole kind. Grants record their own
      operationId: giveConsent
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/ConsentInput"}
      responses:
        "201":
          description: Given
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Consent"}
        "400": {$ref: "#/components/responses/Problem"}

  /consents/{consentId}:
    parameters:
      - {$ref: "#/components/parameters/consentId"}
    get:
      tags: [consents]
      summary: One consent
      operationId: getConsent
      responses:
        "200":
          description: The consent
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Consent"}
        "404": {$ref: "#/components/responses/Problem"}
    delete:
      tags: [consents]
      summary: Withdraw a consent. It stays listed, with the date it was withdrawn
      operationId: withdrawConsent
      responses:
        "200":
          description: The consent, withdrawn
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Consent"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /persons/{personId}/views:
    parameters:
      - {$ref: "#/components/parameters/personId"}
    get:
      tags: [views]
      summary: Views of the record
      operationId: listViews
      responses:
        "200":
          description: Views
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/ViewList"}
    post:
      tags: [views]
      summary: Create a view
      operationId: createView
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/ViewInput"}
      responses:
        "201":
          description: Created
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/View"}
        "400": {$ref: "#/components/responses/Problem"}

  /views/{viewId}:
    parameters:
      - {$ref: "#/components/parameters/viewId"}
    get:
      tags: [views]
      summary: One view
      operationId: getView
      responses:
        "200":
          description: The view
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/View"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      tags: [views]
      summary: Edit a view; views are not facts
      operationId: replaceView
      parameters:
        - {$ref: "#/components/parameters/ifMatch"}
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/ViewInput"}
      responses:
        "200":
          description: Replaced
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/View"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}

  /views/{viewId}/facts:
    parameters:
      - {$ref: "#/components/parameters/viewId"}
    get:
      tags: [views]
      summary: Facts selected by the view, with its fields only
      description: The owner reads it without a grant; a reader, under an active grant that has not expired. Each read under a grant is logged
      operationId: getViewFacts
      security: [{}, {readerToken: []}]
      parameters:
        - {$ref: "#/components/parameters/ifNoneMatch"}
      responses:
        "200":
          description: Visible facts
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Last-Modified: {$ref: "#/components/headers/LastModified"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/ViewFacts"}
        "304":
          description: Not modified
        "404": {$ref: "#/components/responses/Problem"}

  /views/{viewId}/resume:
    parameters:
      - {$ref: "#/components/parameters/viewId"}
    get:
      tags: [views]
      summary: Facts selected by the view, as a JSON Resume document
      operationId: getViewResume
      security: [{}, {readerToken: []}]
      parameters:
        - name: identity
          in: query
          required: true
          description: The identity whose name and contact go on the CV
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: A JSON Resume document; render it with any JSON Resume theme
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema:
                description: JSON Resume schema, https://jsonresume.org/schema
                type: object
        "404": {$ref: "#/components/responses/Problem"}

  /views/{viewId}/grants:
    parameters:
      - {$ref: "#/components/parameters/viewId"}
    get:
      tags: [grants]
      summary: Who may read this view
      operationId: listGrants
      responses:
        "200":
          description: Grants, revoked ones included
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/GrantList"}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      tags: [grants]
      summary: Give a reader access to this view. Records the owner's consent (kind grant)
      operationId: createGrant
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: {$ref: "#/components/schemas/GrantInput"}
      responses:
        "201":
          description: Created. With method bearer, the token is in this response only
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/GrantCreated"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}

  /grants/{grantId}:
    parameters:
      - {$ref: "#/components/parameters/grantId"}
    get:
      tags: [grants]
      summary: One grant
      operationId: getGrant
      responses:
        "200":
          description: The grant
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Grant"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [grants]
      summary: Revoke a grant, or change when it expires. Revoking is final and withdraws its consent
      operationId: changeGrant
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: "#/components/schemas/GrantChange"}
      responses:
        "200":
          description: The grant, as changed
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/Grant"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}

  /grants/{grantId}/access-log:
    parameters:
      - {$ref: "#/components/parameters/grantId"}
    get:
      tags: [grants]
      summary: When the reader read the view through this grant
      operationId: getAccessLog
      responses:
        "200":
          description: Reads, most recent first
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/AccessLog"}
        "404": {$ref: "#/components/responses/Problem"}

  /reference/skills:
    get:
      tags: [reference]
      summary: Search ESCO skills and skill groups
      operationId: searchSkills
      parameters:
        - {$ref: "#/components/parameters/q"}
        - {$ref: "#/components/parameters/language"}
      responses:
        "200":
          description: Ranked candidates
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/SkillCandidateList"}

  /reference/concepts:
    get:
      tags: [reference]
      summary: Search Wikidata concepts
      operationId: searchConcepts
      parameters:
        - {$ref: "#/components/parameters/q"}
        - {$ref: "#/components/parameters/language"}
      responses:
        "200":
          description: Ranked candidates
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/ConceptCandidateList"}

components:
  parameters:
    personId: {name: personId, in: path, required: true, schema: {type: string, format: uuid}}
    factId: {name: factId, in: path, required: true, schema: {type: string, format: uuid}}
    viewId: {name: viewId, in: path, required: true, schema: {type: string, format: uuid}}
    taskId: {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
    termId: {name: termId, in: path, required: true, schema: {type: string, format: uuid}}
    grantId: {name: grantId, in: path, required: true, schema: {type: string, format: uuid}}
    consentId: {name: consentId, in: path, required: true, schema: {type: string, format: uuid}}
    kind:
      name: kind
      in: path
      required: true
      description: A kind of plugin the server declares, without its version, e.g. term-matching
      schema: {type: string, pattern: "^[a-z][a-z0-9-]*$"}
    status:
      name: status
      in: query
      schema: {$ref: "#/components/schemas/Status"}
    q:
      name: q
      in: query
      required: true
      schema: {type: string, minLength: 1}
    language:
      name: language
      in: query
      description: BCP 47 language tag of the words. Absent, the owner's first language, else en
      schema: {type: string}
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    ifNoneMatch:
      name: If-None-Match
      in: header
      schema: {type: string}

  headers:
    Location:
      schema: {type: string, format: uri-reference}
    ETag:
      schema: {type: string}
    LastModified:
      schema: {type: string}
    CacheControl:
      schema: {type: string}

  securitySchemes:
    readerToken:
      description: A grant with auth method bearer. A grant with method socket needs no header; the server reads the calling user from the socket
      type: http
      scheme: bearer

  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}

  schemas:
    Status:
      type: string
      enum: [proposed, accepted, rejected]

    Uri:
      type: string
      format: uri

    PartialDate:
      description: A date at the precision its source gives, year, year and month, or full date (YYYY, YYYY-MM, YYYY-MM-DD). It stands for the whole year or month it names.
      type: string
      pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12][0-9]|3[01]))?)?$"

    Level:
      description: 1 basic, 2 intermediate, 3 experienced, 4 advanced, 5 expert; null when unknown
      oneOf:
        - {type: integer, minimum: 1, maximum: 5}
        - {type: "null"}

    Resource:
      description: Every resource has an identifier, a type and the actions available next
      type: object
      required: ["@id", "@type", potentialAction]
      properties:
        "@context": {type: string, format: uri-reference, x-go-name: JSONLDContext}
        "@id": {type: string, format: uri-reference}
        "@type": {type: string}
        potentialAction:
          type: array
          items: {$ref: "#/components/schemas/Action"}

    Action:
      description: A possible next request, as a schema.org Action
      type: object
      required: ["@type", name, target]
      properties:
        "@type":
          type: string
          examples: [AcceptAction, RejectAction, CancelAction, CreateAction, UpdateAction, ViewAction, SearchAction]
        name:
          type: string
          description: What the action does, in plain words
        target: {$ref: "#/components/schemas/EntryPoint"}
        object:
          description: Body to send, when fixed
          type: object

    EntryPoint:
      type: object
      required: [httpMethod, urlTemplate]
      properties:
        "@type": {const: EntryPoint}
        httpMethod: {type: string, enum: [GET, POST, PUT, PATCH, DELETE]}
        urlTemplate: {type: string, description: RFC 6570 URL template}
        contentType: {type: string}

    Entry:
      x-actions:
        - {type: ViewAction, name: My record, method: GET, target: "/persons/{personId}"}
        - {type: ViewAction, name: This server, method: GET, target: /server}
        - {type: CreateAction, name: Import a CV, method: POST, target: /imports, contentType: text/plain}
        - {type: SearchAction, name: Review proposed practices, method: GET, target: "/persons/{personId}/practices?status=proposed"}
        - {type: SearchAction, name: Review proposed occupations, method: GET, target: "/persons/{personId}/occupations?status=proposed"}
        - {type: ViewAction, name: My views, method: GET, target: "/persons/{personId}/views"}
        - {type: ViewAction, name: My identities, method: GET, target: "/persons/{personId}/identities"}
        - {type: ViewAction, name: My preferences, method: GET, target: "/persons/{personId}/preferences"}
        - {type: ViewAction, name: My consents, method: GET, target: "/persons/{personId}/consents"}
        - {type: SearchAction, name: Find an ESCO skill, method: GET, target: "/reference/skills{?q,language}"}
        - {type: SearchAction, name: Find a Wikidata concept, method: GET, target: "/reference/concepts{?q,language}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            person: {type: string, format: uri-reference}

    Server:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [demo, storage]
          properties:
            demo:
              description: Demo mode, without login; not for production
              type: boolean
            storage:
              description: Where the records are stored
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [docker-volume, path]}
                volume: {type: [string, "null"], description: "docker-volume: the volume name"}
                project: {type: [string, "null"], description: "docker-volume: the compose project name"}
                path: {type: [string, "null"], description: "path: the data directory"}

    Person:
      x-actions:
        - {type: ViewAction, name: Occupations held, method: GET, target: "/persons/{personId}/occupations"}
        - {type: ViewAction, name: Practices, method: GET, target: "/persons/{personId}/practices"}
        - {type: ViewAction, name: Identities, method: GET, target: "/persons/{personId}/identities"}
        - {type: ViewAction, name: Views, method: GET, target: "/persons/{personId}/views"}
        - {type: ViewAction, name: Preferences, method: GET, target: "/persons/{personId}/preferences"}
        - {type: ViewAction, name: Consents, method: GET, target: "/persons/{personId}/consents"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            completion:
              description: Average completion of the record's facts that are not rejected, from 0 to 1
              type: number
              minimum: 0
              maximum: 1
              readOnly: true

    Concept:
      description: Wikidata concept (`is`), refined by other Wikidata concepts (`with`), with an optional label
      type: object
      required: [is]
      properties:
        is: {$ref: "#/components/schemas/Uri"}
        with:
          type: array
          items: {$ref: "#/components/schemas/Uri"}
          default: []
        label: {type: [string, "null"]}

    FactFields:
      type: object
      required: [author, recorded, status, completion]
      properties:
        author: {type: string}
        recorded: {type: string, format: date-time}
        status: {$ref: "#/components/schemas/Status"}
        completion:
          description: Share of the fact's fields that are set, from 0 to 1; computed by the server
          type: number
          minimum: 0
          maximum: 1
          readOnly: true
        evidence:
          description: Any JSON, e.g. a CV excerpt or a certificate link; stored and returned unchanged

    OccupationHeldInput:
      type: object
      required: [label, kind, from]
      properties:
        occupation:
          description: ESCO occupation
          oneOf: [{$ref: "#/components/schemas/Uri"}, {type: "null"}]
        label: {type: string}
        kind: {type: string, enum: [work, pleasure, study]}
        from: {$ref: "#/components/schemas/PartialDate"}
        to: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}
        description:
          description: What the person did there, such as for a CV. Markdown (CommonMark) recommended; clients render no raw HTML
          type: [string, "null"]
        evidence: {}

    OccupationHeld:
      x-actions:
        - {type: UpdateAction, name: Edit this occupation, method: PATCH, target: "@id"}
        - {type: AcceptAction, name: Accept this occupation, method: PATCH, target: "@id", body: {status: accepted}, when: status is not accepted}
        - {type: RejectAction, name: Reject this occupation, method: PATCH, target: "@id", body: {status: rejected}, when: status is not rejected}
        - {type: DeleteAction, name: Delete this occupation, method: DELETE, target: "@id{?practices,to}"}
        - {type: CreateAction, name: Add a practice at this occupation, method: POST, target: "/persons/{personId}/practices", when: status is accepted}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - $ref: "#/components/schemas/OccupationHeldInput"
        - $ref: "#/components/schemas/FactFields"

    PracticeInput:
      type: object
      required: [skill, concept, from]
      properties:
        skill:
          description: ESCO skill
          allOf: [{$ref: "#/components/schemas/Uri"}]
        concept: {$ref: "#/components/schemas/Concept"}
        context:
          description: Wikidata item, e.g. a language
          oneOf: [{$ref: "#/components/schemas/Uri"}, {type: "null"}]
        occupation:
          description: The occupation held, by its @id
          type: [string, "null"]
          format: uri-reference
        from:
          description: Start of the period. Null only on a proposed practice whose source gives no period; required to accept.
          oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]
        to: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}
        level: {$ref: "#/components/schemas/Level"}
        evidence:
          description: Any JSON. From a CV import, `{excerpt, file, line}`.

    Practice:
      x-actions:
        - {type: UpdateAction, name: Correct this practice, method: PATCH, target: "@id"}
        - {type: AcceptAction, name: Accept this practice, method: PATCH, target: "@id", body: {status: accepted}, when: status is not accepted and from is set}
        - {type: RejectAction, name: Reject this practice, method: PATCH, target: "@id", body: {status: rejected}, when: status is not rejected}
        - {type: DeleteAction, name: Delete this practice, method: DELETE, target: "@id"}
        - {type: CreateAction, name: Record progress as a new practice, method: POST, target: "/persons/{personId}/practices", when: status is accepted}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - $ref: "#/components/schemas/PracticeInput"
        - $ref: "#/components/schemas/FactFields"

    Review:
      description: Sets the status of a fact; without it, the status is unchanged
      type: object
      properties:
        status: {type: string, enum: [accepted, rejected]}

    OccupationReview:
      description: Merge patch on an occupation; fields edited, status optional
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: object
          properties:
            occupation: {oneOf: [{$ref: "#/components/schemas/Uri"}, {type: "null"}]}
            label: {type: string}
            kind: {type: string, enum: [work, pleasure, study]}
            from: {$ref: "#/components/schemas/PartialDate"}
            to: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}

    PracticeReview:
      description: Merge patch on a practice; fields edited, status optional
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: object
          properties:
            skill: {$ref: "#/components/schemas/Uri"}
            concept: {$ref: "#/components/schemas/Concept"}
            context: {oneOf: [{$ref: "#/components/schemas/Uri"}, {type: "null"}]}
            from: {$ref: "#/components/schemas/PartialDate"}
            to: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}
            level: {$ref: "#/components/schemas/Level"}

    IdentityInput:
      type: object
      required: [label]
      properties:
        label: {type: string}
        contact: {type: [string, "null"]}

    Identity:
      x-actions:
        - {type: ViewAction, name: Back to my record, method: GET, target: "/persons/{personId}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - $ref: "#/components/schemas/IdentityInput"

    PreferencesInput:
      description: Preferences of scope server. Merge patch; a null value removes a preference
      type: object
      additionalProperties: false
      properties:
        languages:
          description: BCP 47 language tags, in the owner's order; labels are returned in these first
          type: [array, "null"]
          items: {type: string, minLength: 1}

    Preferences:
      x-actions:
        - {type: UpdateAction, name: Change my preferences, method: PATCH, target: "@id", contentType: application/merge-patch+json}
        - {type: ViewAction, name: Back to my record, method: GET, target: "/persons/{personId}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - $ref: "#/components/schemas/PreferencesInput"
        - type: object
          properties:
            plugins:
              description: Kinds of plugin that keep preferences for the owner
              type: array
              items:
                type: object
                required: [kind, "@id"]
                properties:
                  kind: {type: string}
                  "@id": {type: string, format: uri-reference}

    PluginPreferences:
      x-actions:
        - {type: DeleteAction, name: Forget what this plugin kept, method: DELETE, target: "@id"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [kind, entries]
          properties:
            kind: {type: string}
            entries:
              description: Keys and values the plugin returned; opaque to the server
              type: array
              items:
                type: object
                required: [key, value, updated]
                properties:
                  key: {type: string}
                  value: {description: Any JSON value}
                  updated: {type: string, format: date-time}

    ConsentInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [remote-plugin, hosted-terms, proposal]
          description: Grants record their own consent (kind grant)
        subject:
          description: A plugin URL, a URL of terms, an author. Absent, agreement by default to the whole kind
          type: [string, "null"]

    Consent:
      x-actions:
        - {type: DeleteAction, name: Withdraw, method: DELETE, target: "@id", when: not withdrawn and kind is not grant}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [kind, given]
          properties:
            kind: {type: string, enum: [remote-plugin, hosted-terms, grant, proposal]}
            subject: {type: [string, "null"]}
            given: {type: string, format: date-time}
            withdrawn: {type: [string, "null"], format: date-time}

    ConsentList:
      x-actions:
        - {type: CreateAction, name: Give a consent, method: POST, target: "/persons/{personId}/consents"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/Consent"}}

    ViewInput:
      type: object
      properties:
        label: {type: string, description: e.g. the job offer it is for}
        include:
          type: object
          properties:
            occupation_kind:
              type: [array, "null"]
              items: {type: string, enum: [work, pleasure, study]}
            occupation:
              type: [array, "null"]
              items: {type: string, format: uri-reference}
            period:
              description: A fact is included if its period overlaps this one.
              type: [object, "null"]
              properties:
                from: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}
                to: {oneOf: [{$ref: "#/components/schemas/PartialDate"}, {type: "null"}]}
            skill_under:
              description: ESCO skill groups
              type: [array, "null"]
              items: {$ref: "#/components/schemas/Uri"}
            status:
              description: "Default: proposed and accepted; a view with a grant: accepted only"
              type: [array, "null"]
              items: {type: string, enum: [proposed, accepted]}
        include_facts:
          type: array
          items: {type: string, format: uri-reference}
          default: []
        exclude_facts:
          type: array
          items: {type: string, format: uri-reference}
          default: []
        show:
          type: object
          properties:
            level: {type: boolean, default: true}
            evidence: {type: boolean, default: false}
            description: {type: boolean, default: false, description: Descriptions of occupations held}

    View:
      x-actions:
        - {type: ViewAction, name: See the facts this view shows, method: GET, target: "/views/{viewId}/facts"}
        - {type: ViewAction, name: Export as a CV (JSON Resume), method: GET, target: "/views/{viewId}/resume{?identity}"}
        - {type: UpdateAction, name: Edit this view, method: PUT, target: "@id", header: If-Match}
        - {type: ViewAction, name: Who reads this view, method: GET, target: "@id/grants"}
        - {type: CreateAction, name: Share this view, method: POST, target: "@id/grants"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - $ref: "#/components/schemas/ViewInput"

    ViewFacts:
      x-actions:
        - {type: ViewAction, name: The view, method: GET, target: "/views/{viewId}"}
        - {type: ViewAction, name: Export as a CV (JSON Resume), method: GET, target: "/views/{viewId}/resume{?identity}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            view: {type: string, format: uri-reference}
            occupations:
              type: array
              items: {$ref: "#/components/schemas/OccupationHeld"}
            practices:
              type: array
              items: {$ref: "#/components/schemas/Practice"}

    GrantAuth:
      description: How the reader authenticates (ADR-0013)
      oneOf:
        - type: object
          description: A local user calling on the socket, as the system reports it
          required: [method, user]
          properties:
            method: {const: socket}
            user: {type: string, minLength: 1}
        - type: object
          description: A bearer token, given once when the grant is created; the server keeps only its hash
          required: [method]
          properties:
            method: {const: bearer}
        - type: object
          description: OpenID Connect; parameters to define
          required: [method]
          properties:
            method: {const: oidc}

    GrantInput:
      type: object
      required: [reader, auth]
      properties:
        reader: {type: string, minLength: 1, description: "A person, an organisation or a system, e.g. Michaela, ACME HR"}
        identity:
          description: The identity the person presents to this reader
          type: [string, "null"]
          format: uuid
        expires: {type: [string, "null"], format: date-time}
        auth: {$ref: "#/components/schemas/GrantAuth"}

    GrantChange:
      description: Merge patch on a grant
      type: object
      additionalProperties: false
      properties:
        status: {const: revoked}
        expires: {type: [string, "null"], format: date-time}

    Grant:
      x-actions:
        - {type: ViewAction, name: When it was read, method: GET, target: "@id/access-log"}
        - {type: UpdateAction, name: Revoke, method: PATCH, target: "@id", body: {status: revoked}, when: status is active}
        - {type: ViewAction, name: The view, method: GET, target: "/views/{viewId}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - $ref: "#/components/schemas/GrantInput"
        - type: object
          required: [view, status, consent]
          properties:
            view: {type: string, format: uri-reference}
            status: {type: string, enum: [active, revoked]}
            consent:
              description: The consent this grant recorded
              type: string
              format: uri-reference

    GrantCreated:
      allOf:
        - $ref: "#/components/schemas/Grant"
        - type: object
          properties:
            token:
              description: "Method bearer: the token to give the reader. Not returned again"
              type: string

    GrantList:
      x-actions:
        - {type: CreateAction, name: Share this view, method: POST, target: "/views/{viewId}/grants"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/Grant"}}

    AccessLog:
      x-actions:
        - {type: ViewAction, name: The grant, method: GET, target: "/grants/{grantId}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                required: [at]
                properties:
                  at: {type: string, format: date-time}

    Task:
      x-actions:
        - {type: ViewAction, name: Refresh, method: GET, target: "@id", when: state is ongoing}
        - {type: AcceptAction, name: Yes, read it, method: PATCH, target: "@id", body: {stage: find}, when: kind is cv-import and stage is confirm}
        - {type: CancelAction, name: Stop, method: PATCH, target: "@id", body: {state: abandoned}, when: state is ongoing}
        - {type: SearchAction, name: Review the proposed practices, method: GET, target: "/persons/{personId}/practices?status=proposed", when: kind is cv-import and state is finished}
        - {type: SearchAction, name: Review the proposed occupations, method: GET, target: "/persons/{personId}/occupations?status=proposed", when: kind is cv-import and state is finished}
        - {type: UpdateAction, name: Resume, method: PATCH, target: "@id", body: {state: ongoing}, when: state is interrupted and the kind allows it}
        - {type: RejectAction, name: Reject all facts proposed by this task, method: POST, target: "@id/rejections", when: state is interrupted or abandoned}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [kind, state, started]
          properties:
            kind: {type: string, enum: [cv-import]}
            state:
              description: Canonical; ongoing until finished, abandoned or interrupted
              type: string
              enum: [ongoing, finished, abandoned, interrupted]
            stage:
              description: "While ongoing; defined by the kind. cv-import: extract (skipped for text), confirm, find"
              type: [string, "null"]
            stages:
              description: The stages of this task, in order, for a progress bar
              type: array
              items:
                type: object
                required: [name, progress]
                properties:
                  name: {type: string}
                  label: {type: string}
                  progress: {type: string, enum: [done, current, skipped, to-do]}
            text:
              description: "cv-import, at the confirm stage: the extracted text; removed when the task ends"
              type: [string, "null"]
            started: {type: string, format: date-time}
            ended: {type: [string, "null"], format: date-time}
            result:
              description: "Per kind; kept until the task is deleted. cv-import: terms not matched, each removed when resolved into a fact or left out"
              type: [object, "null"]
              properties:
                unresolved:
                  type: array
                  items:
                    type: object
                    x-actions:
                      - {type: DeleteAction, name: Leave out, method: DELETE, target: "@id"}
                    required: ["@id", term, excerpt]
                    properties:
                      "@id": {type: string, format: uri-reference}
                      term: {type: string}
                      excerpt: {type: string}
                      line: {type: [integer, "null"], minimum: 1}
            problem:
              oneOf: [{$ref: "#/components/schemas/Problem"}, {type: "null"}]

    TaskChange:
      description: "Merge patch on a task: a stage to move to, or a state: abandoned to stop, ongoing to resume"
      type: object
      properties:
        stage: {type: string}
        state: {type: string, enum: [abandoned, ongoing]}

    Candidate:
      type: object
      required: [id, label, source]
      properties:
        id: {$ref: "#/components/schemas/Uri"}
        label: {type: string}
        description: {type: [string, "null"]}
        source: {type: string, enum: [esco, wikidata]}
        why: {type: string, description: Why it matches}

    OccupationList:
      x-actions:
        - {type: CreateAction, name: Add an occupation, method: POST, target: "/persons/{personId}/occupations"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/OccupationHeld"}}
    PracticeList:
      x-actions:
        - {type: CreateAction, name: Add a practice, method: POST, target: "/persons/{personId}/practices"}
        - {type: SearchAction, name: Filter by status, method: GET, target: "/persons/{personId}/practices{?status}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/Practice"}}
    IdentityList:
      x-actions:
        - {type: CreateAction, name: Add an identity, method: POST, target: "/persons/{personId}/identities"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/Identity"}}
    ViewList:
      x-actions:
        - {type: CreateAction, name: Write a view, method: POST, target: "/persons/{personId}/views"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/View"}}
    SkillCandidateList:
      x-actions:
        - {type: SearchAction, name: Search ESCO skills again, method: GET, target: "/reference/skills{?q,language}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/Candidate"}}
    ConceptCandidateList:
      x-actions:
        - {type: SearchAction, name: Search Wikidata concepts again, method: GET, target: "/reference/concepts{?q,language}"}
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/Candidate"}}

    Problem:
      description: RFC 9457
      type: object
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
