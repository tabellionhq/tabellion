# Every commit carries a Signed-off-by line from its author (Developer Certificate of Origin, ADR-0025).
# Commits made before this check are not checked.
name: DCO

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check sign-off of each new commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          filter='.[] | {sha, email: .commit.author.email, message: .commit.message} | tojson'
          if [ "$EVENT" = pull_request ]; then
            commits=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq "$filter")
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            commits=$(gh api "repos/$REPO/commits/$AFTER" --jq "[.] | $filter")
          else
            commits=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq ".commits | $filter")
          fi
          if [ -z "$commits" ]; then
            echo "No commit to check."
            exit 0
          fi
          failed=0
          while IFS= read -r c; do
            sha=$(jq -r .sha <<<"$c")
            email=$(jq -r .email <<<"$c" | tr '[:upper:]' '[:lower:]')
            if jq -r .message <<<"$c" | tr '[:upper:]' '[:lower:]' | grep -qF "signed-off-by:" \
              && jq -r .message <<<"$c" | tr '[:upper:]' '[:lower:]' | grep -E '^signed-off-by: ' | grep -qF "<$email>"; then
              echo "ok      $sha"
            else
              echo "missing $sha: no Signed-off-by line with the author's email <$email>" >&2
              failed=1
            fi
          done <<<"$commits"
          if [ "$failed" -ne 0 ]; then
            echo "Sign off each commit: git commit -s. To fix earlier commits: git rebase --signoff <base>. See CONTRIBUTING.md." >&2
          fi
          exit "$failed"
